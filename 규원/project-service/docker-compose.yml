services:
  mariadb:
    image: mariadb:latest
    container_name: project-service-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: project
      MYSQL_USER: sequence
      MYSQL_PASSWORD: sequence
    ports:
      - "3310:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: project-service-phpmyadmin
    environment:
      PMA_HOST: mariadb   # 기본적으로 mariadb에 연결
      PMA_HOSTS: mariadb # mariadb
      PMA_USER: sequence
      PMA_PASSWORD: sequence
      MYSQL_ROOT_PASSWORD: 1234  # MariaDB root 비밀번호
    ports:
      - "9010:80"  # phpMyAdmin에 접속하는 포트 (브라우저에서 http://localhost:8080 사용)
    depends_on:
      - mariadb
volumes:
  mariadb_data: